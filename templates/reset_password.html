<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password | EXTERNSHIP INTERN PLATFORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div class="mb-3">
                <div class="h4 mb-0">Reset password</div>
                <div class="text-secondary small">Choose a new password for your account.</div>
              </div>

              {% with messages = get_flashed_messages(with_categories=True) %}
                {% if messages %}
                  {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                      {{ message }}
                      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                  {% endfor %}
                {% endif %}
              {% endwith %}

              <form method="post">
                <div class="mb-3">
                  <label class="form-label">New password</label>
                  <input class="form-control" type="password" name="password" required minlength="6" />
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirm new password</label>
                  <input class="form-control" type="password" name="confirm_password" required minlength="6" />
                </div>
                <button class="btn btn-primary w-100" type="submit">Update password</button>
              </form>

              <div class="mt-3">
                <a class="small" href="{{ url_for('auth.login') }}">Back to login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
