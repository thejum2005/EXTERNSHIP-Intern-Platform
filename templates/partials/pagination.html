{% if page.pages > 1 %}
  <nav aria-label="Pagination">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item {% if not page.has_prev %}disabled{% endif %}">
        <a class="page-link" href="{{ request.path }}?{{ request.query_string|safe|replace('page=' ~ page.page, '') }}&page={{ page.prev_num }}">Prev</a>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ page.page }} / {{ page.pages }}</span>
      </li>
      <li class="page-item {% if not page.has_next %}disabled{% endif %}">
        <a class="page-link" href="{{ request.path }}?{{ request.query_string|safe|replace('page=' ~ page.page, '') }}&page={{ page.next_num }}">Next</a>
      </li>
    </ul>
  </nav>
{% endif %}
