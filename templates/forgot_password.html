<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Forgot Password | EXTERNSHIP INTERN PLATFORM</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

<style>

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url("/static/img/login-bg.png");

    background-size:cover;
    background-position:center;
}

</style>

</head>

<body>

<div class="card shadow-sm" style="width:420px">

<div class="card-body p-4">

<div class="text-center mb-3">
<h4 class="mb-1">Update Password</h4>
<div class="text-secondary small">Enter your email and set a new password</div>
</div>

{% with messages = get_flashed_messages(with_categories=True) %}
{% if messages %}
{% for category, message in messages %}

<div class="alert alert-{{ category }} alert-dismissible fade show">
{{ message }}
<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="mb-3">
<label class="form-label">Email</label>
<input
class="form-control"
type="email"
name="email"
required
>
</div>

<div class="mb-3">
<label class="form-label">New Password</label>
<input
class="form-control"
type="password"
name="password"
required
>
</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>
<input
class="form-control"
type="password"
name="confirm_password"
required
>
</div>

<button class="btn btn-primary w-100" type="submit">
Update Password
</button>

</form>

<div class="text-center mt-3">
<a class="small" href="{{ url_for('auth.login') }}">Back to login</a>
</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
